name: Feature or change
description: Something DIMS should do that it does not.
labels: ["type:feat"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should exist
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The research question or workflow this unblocks.
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Which layer
      options:
        - A tab (see docs/contracts/tab.md)
        - An analysis (see docs/contracts/step.md)
        - The builder
        - The core / host
        - Docs or contracts
        - Not sure
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: How we would know it works
      description: >
        A check someone can run. An issue with this filled in can be labelled
        `agent-ready` and picked up by a contributor with no other context.
