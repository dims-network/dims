name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    uses: dims-network/.github/.github/workflows/reusable-dashboard-ci.yml@main
    with:
      python_paths: "app template/opt"
      js_glob: "app/static/*.js"
      config_path: ""
      check_assets: false

  builder-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q -r requirements.txt pytest
      - name: Tests
        run: python -m pytest tests/ -q
