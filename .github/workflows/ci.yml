name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-config:
    uses: dims-network/.github/.github/workflows/reusable-dashboard-ci.yml@main
    with:
      python_paths: "packages/dims-analysis packages/dims-case packages/dims-case-scaffold apps/builder tools"
      # Every JavaScript file that ships, not only the two that started here.
      # builder.js is 1100 lines and was not syntax-checked at all, and the
      # docs figures are the only code on the published site.
      js_glob: "packages/dims-core/*.js packages/dims-tabs/*.js apps/builder/dims_builder/static/*.js docs/analyses/demo/*.js"
      # The scaffold's config.json is not a study's: it names no recordings
      # until someone fills it in. The `contracts` job below validates it as
      # what it is, which this generic check cannot.
      config_path: ""
      check_assets: false

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q -e ".[dev]"

      # These checks used to live here as two inline heredocs, with
      # tests/test_contracts.py holding a near-verbatim second copy that no job
      # ran. Two implementations of one rule is how they disagree; the one a
      # contributor can run before pushing is the one that should be real, so
      # the job runs that file and the heredocs are gone.
      #
      # The schema is the contract every case repo is validated against, the
      # scaffold must ship no study, the README's links must resolve, and one
      # version must be declared everywhere and match the changelog.
      - name: The repository's own contracts and version coherence
        run: python -m pytest tests/test_contracts.py tests/test_release.py -q

  analysis-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -q -e ".[dev]"
      - name: Steps must be discoverable
        run: |
          out=$(dims-analysis list)
          echo "$out"
          for s in rqa crqa crosswavelet; do
            echo "$out" | grep -q "^  $s " || { echo "::error::step '$s' is not registered"; exit 1; }
          done
      - name: Tests
        run: python -m pytest packages/dims-analysis/tests -q

  # The tooling that makes a study a study: the vendored-core hash check, the
  # stale-asset and shadowed-tab checks, and the privacy hooks that stop
  # identifiable video leaving a machine. 31 tests over 678 lines, and until
  # this job existed not one of them ran on a pull request -- the suite most
  # worth running was the one nothing ran. It needs no analysis dependencies:
  # it drives `dims-case` and `build_assets.py` as a study does.
  case-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q -e ".[dev]"
      - name: Case tooling, vendoring and the privacy hooks
        run: python -m pytest packages/dims-case/tests -q

  # The analyses answering correctly, not merely running. Every other test in
  # this repository can only ask "did it crash?" -- on real data `DET = 0.2571`
  # is a number nobody can check. `examples/reference/` is a synthetic study
  # whose answers are arithmetic: a 2 s sine recurs at 2 s, a 0.4 s lag sits
  # 0.4 s off the diagonal, two independent red noises beat a 95 % level 5 % of
  # the time, and the wavelet constants are Torrence & Compo's published ones.
  #
  # This job is why a case repo can trust a release. The analyses are not
  # vendored -- a study installs them from the core it pins -- so a defect that
  # gets past here reaches every study that bumps, which is exactly how the
  # ones already found got where they were.
  reference-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pyrqa computes through OpenCL and has no CPU fallback; pocl is the
      # runtime that gives a runner one.
      - name: OpenCL runtime for pyrqa
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pocl-opencl-icd

      - name: Install
        run: |
          python -m pip install -q -e packages/dims-analysis
          python -m pip install -q pytest pyrqa

      # The pyrqa tests are `importorskip`ed, so a runner without it stays green
      # while the independent oracle for DET, LAM and RR silently does not run.
      # A gate that can pass without checking anything is not a gate.
      - name: The independent oracle must actually be available
        run: |
          python - <<'PY'
          import pyrqa.computation, pyrqa.time_series
          from pyrqa.analysis_type import Classic
          print("pyrqa available")
          PY

      - name: The reference study answers what it should
        run: python -m pytest tests/reference -q -rs

  dashboard-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test tooling
        working-directory: packages/dims-core/test
        run: npm install --no-audit --no-fund
      - name: Tests
        working-directory: packages/dims-core/test
        run: node --test

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -q -e ".[dev]"
      - name: The checks must catch what they were written for
        working-directory: packages/dims-notebooks
        run: python -m pytest tests/ -q
      - name: Notebooks are valid
        run: |
          python - <<'PY'
          import json, glob, sys
          bad = 0
          for f in glob.glob("packages/dims-notebooks/*.ipynb"):
              d = json.load(open(f))
              if d.get("nbformat") != 4 or not d.get("cells"):
                  print(f"::error file={f}::not a usable notebook"); bad = 1
          sys.exit(bad)
          PY

  builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with the builder extra
        run: python -m pip install -q -e ".[builder,dev]"
      - name: Tests
        working-directory: apps/builder
        run: python -m pytest tests -q
      - name: The wizard builds a complete study
        run: |
          python - <<'PY'
          import json, os, sys, tempfile
          sys.path.insert(0, "apps/builder")
          from dims_builder.server import create_app
          out = os.path.join(tempfile.mkdtemp(), "study")
          r = create_app().test_client().post("/api/project",
                                              json={"output_dir": out, "template": "bundled"})
          assert r.status_code == 200, r.get_json()
          # A generated study must be complete: the wizard's user is the one
          # least able to work out why a dashboard is missing its core.
          for need in ("config.json", "index.html", "serve.py", "dims-case.json",
                       "vendor/dims-core", "vendor/dims-tabs"):
              assert os.path.exists(os.path.join(out, need)), f"missing {need}"
          print("generated study is complete")
          PY
