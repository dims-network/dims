[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dims-analysis"
version = "2.0.0"
description = "Analyses for DIMS: recurrence quantification, cross-recurrence and cross-wavelet coherence over multimodal time series."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DIMS-network contributors" }]
keywords = ["multimodal", "time series", "recurrence quantification", "wavelet coherence", "interaction"]

# Floor pins, not exact ones: these use long-stable APIs. The file this
# replaces pinned "scipy==1.26.4", which does not exist -- 1.26.4 is a numpy
# version -- and listed "json", which is stdlib, so it could not be installed
# at all.
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "pandas>=2.0.0",
  "pycwt==0.5.0b0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
dims-analysis = "dims_analysis.cli:main"

# Steps are discovered through this group. A step in a separate package
# registers exactly the same way -- that is how an outside module joins the
# pipeline without a change here.
[project.entry-points."dims.steps"]
rqa = "dims_analysis.steps.rqa:Step"
crqa = "dims_analysis.steps.crqa:Step"
crosswavelet = "dims_analysis.steps.crosswavelet:Step"

[tool.setuptools.packages.find]
include = ["dims_analysis*"]
