[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# "dims" is already taken on PyPI by an unrelated project, so the distribution
# carries the network's name. The import packages keep their own names.
name = "dims-network"
version = "1.0.2"
description = "DIMS — tools for exploring dynamic interactions and multimodal signals: recurrence quantification, wavelet coherence, and a dashboard for looking at them against video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DIMS-network contributors" }]
keywords = ["multimodal", "interaction", "time series", "recurrence quantification",
            "wavelet coherence", "behavioural research"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

# The analyses, and nothing else. A machine that only computes results should
# not install a web framework to do it.
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "pandas>=2.0.0",
  # Pinned exactly. Every pycwt release is a pre-release, so an unpinned
  # install resolves to whatever the newest beta happens to be -- and this is
  # the package that computes the coherence and its Monte Carlo null. 0.5.0b0
  # is what the published results were produced with.
  "pycwt==0.5.0b0",
]

[project.optional-dependencies]
# The no-code wizard. Flask lives here rather than in the base dependencies so
# `pip install dims-network` stays a scientific install.
builder = [
  "flask>=3.0",
  "imageio-ffmpeg>=0.4",
  # The wizard validates what it is about to write against the same schema CI
  # validates every study against, so it cannot produce a config the core would
  # reject -- a failure that otherwise surfaces later as an empty tab.
  "jsonschema>=4.0",
]
# The sanity-check notebooks.
notebooks = [
  "matplotlib>=3.7.0",
  "jupyterlab>=4.0",
]
dev = [
  "pytest>=7",
  "jsonschema>=4",
  # The builder's suite is part of `pytest` at the repository root, so the
  # command a contributor actually runs has to be able to import it. It is
  # still guarded, so a dev install without it skips rather than errors.
  "flask>=3.0",
]

[project.urls]
Homepage = "https://dims-network.github.io/"
Source = "https://github.com/dims-network/dims"
Issues = "https://github.com/dims-network/dims/issues"

[project.scripts]
dims-analysis = "dims_analysis.cli:main"
dims-case = "dims_case.cli:main"
dims-builder = "dims_builder.__main__:main"

# Analyses are discovered through this group, so one published in a separate
# package joins the pipeline with no change here.
[project.entry-points."dims.steps"]
rqa = "dims_analysis.steps.rqa:Step"
crqa = "dims_analysis.steps.crqa:Step"
crosswavelet = "dims_analysis.steps.crosswavelet:Step"

# `pytest` with no arguments is the command a contributor actually runs, so it
# has to mean something. Without `testpaths` it collected by walking the tree,
# which worked only because nothing collectable happened to sit anywhere else
# -- and it would have walked into a study's vendor/ or the wizard's staging
# directory the moment one appeared. The five roots are the ones tests/README.md
# names; a sixth belongs here the day it exists.
[tool.pytest.ini_options]
testpaths = [
  "tests",
  "packages/dims-analysis/tests",
  "packages/dims-case/tests",
  "packages/dims-notebooks/tests",
  "apps/builder/tests",
]
norecursedirs = [
  ".git", "*.egg-info", "build", "dist", "node_modules",
  "vendor",            # a study's vendored core is a copy, not a source
  "_staging",          # the wizard's upload scratch: 53 MB of duplicate media
  "assets",            # generated study data
]
markers = [
  "slow: needs the reference study built, or pyrqa, or a Monte Carlo run",
]
# An unregistered marker is a typo that silently disables a test.
addopts = "--strict-markers"

# One distribution builds everything. packages/dims-analysis carried its own
# pyproject.toml declaring the same version, the same dependencies, the same
# `dims-analysis` console script and the same three `dims.steps` entry points --
# so installing both registered every step twice and gave two distributions a
# claim on one command name. The whole core moves together anyway; that is what
# a study pins.
#
# dims_checks is in this list now. It declares a __version__ and has an extra of
# its own, but was in no `where`, so nothing could install it and CI had to cd
# into its directory to make the imports resolve.
[tool.setuptools.packages.find]
where = ["packages/dims-analysis", "packages/dims-case", "packages/dims-notebooks",
         "apps/builder"]
include = ["dims_analysis*", "dims_case*", "dims_checks*", "dims_builder*"]

[tool.setuptools.package-data]
dims_builder = ["static/*", "static/**/*"]
